name: SolarEdge Local
version: "0.3.0"
slug: solaredge_local
description: Local SolarEdge inverter and optimizer data via FRITZ!Box packet capture, published over MQTT
url: https://github.com/huer12/ha-addon-solaredge-legacy
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:need
# Required options (FRITZ!Box user/password, inverter IP and key) have no default on purpose:
# the Supervisor refuses to start the app until they are filled in on the Configuration tab.
options:
  fritzbox_host: fritz.box
  capture_interface: 1-lan
  optimizer_details: false
  force_reconnect: true
  log_level: info
schema:
  fritzbox_host: str
  fritzbox_user: str
  fritzbox_password: password
  inverter_ip: 'match(^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$)'
  inverter_key: password
  capture_interface: str
  optimizer_details: bool
  force_reconnect: bool
  log_level: list(debug|info|warning|error)
